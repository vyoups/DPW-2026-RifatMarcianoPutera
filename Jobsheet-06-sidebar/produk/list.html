<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SewaGear - Produk</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="produk">
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">Sewa Gear</div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="../index.html">Dashboard</a></li>
                    <li><a href="list.html" class="active">Daftar Produk</a></li>
                    <li><a href="tambah.html">Tambah Produk</a></li>
                    <li><a href="../customer/list.html">Daftar Customer</a></li>
                    <li><a href="../customer/tambah.html">Tambah Customer</a></li>
                </ul>
            </nav>
        </aside>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <div class="app-main">
            <div class="topbar">
                <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Buka menu">&#9776;</button>
                <h1>Daftar Produk</h1>
            </div>

            <main>
                <section>
                    <h2>Daftar Produk</h2>
                    <div class="table-toolbar">
                        <div class="search-box">
                            <label for="search-input">Cari Produk</label>
                            <input type="text" id="search-input" placeholder="Ketik nama produk...">
                        </div>
                    </div>
                    <p id="loading-indicator" style="display:none;">Memuat data...</p>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nama</th>
                                    <th>Harga Sewa</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                    <p id="row-counter" class="row-counter"></p>
                </section>
            </main>

            <footer>
                <p>&copy; 2026 Sewa Gear &mdash; UTS</p>
            </footer>
        </div>
    </div>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/produk.js"></script>
</body>
</html>
